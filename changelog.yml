    - id: "534"
      type: feat
      scopes:
        - tile
      description: "**Evolution majeur du composant Tuile :**\r

        Nous souhaitons revoir la structure html de la tuile pour étendre les
        variations de contenu (avec détails, badge, etc), et uniformiser avec
        les comportements de la Carte (card).\r

        \r

        Changements apportés :\r

        - Ajout d'un niveau d'encapsulation dans la structure html\r

        \  - Ajout d'un wrapper \"fr-tile__content\" pour englober le contenu\r

        \  - Ajout d'un wrapper \"fr-tile__header\" pour englober l'image\r

        - L'image des tuiles est remplacée par un pictogramme\r

        \  - La classe \"fr-tile__img\" devient \"fr-tile__pictogram\" \r

        \  - Son contenu est maintenant un svg \"fr-artwork\"\r

        - Ajout de la possibilité de placer un badge, un tag, un texte de
        détail, dans le contenu de la tuile\r

        - Ajout d'une taille de tuile SM : \"fr-tile--sm\"\r

        \r

        **⚠️ Breaking Change**\r

        Le snippet de code d'une tuile : \r

        ```html\r

        <div class=\"fr-tile fr-enlarge-link\">\r

        \    <div class=\"fr-tile__body\">\r

        \        <h4 class=\"fr-tile__title\">\r

        \            <a class=\"fr-tile__link\" href>Titre M bold</a>\r

        \        </h4>\r

        \        <p class=\"fr-tile__desc\">Texte M regular 2 lignes max</p>\r

        \   </div>\r

        \   <div class=\"fr-tile__img\">\r

        \       <img class=\"fr-responsive-img\"
        src=\"../../../example/img/placeholder.1x1.png\" alt=\"\" />\r

        \       <!-- L’alternative de l’image (attribut alt) doit rester vide
        car l’image est illustrative et ne doit pas être restituée aux
        technologies d’assistance -->\r

        \    </div>\r

        </div>\r

        ```\r

        \r

        Devient : \r

        ```html\r

        <div class=\"fr-tile fr-enlarge-link\" id=\"tile-6584\">\r

        \    <div class=\"fr-tile__body\">\r

        \        <div class=\"fr-tile__content\">\r

        \            <h3 class=\"fr-tile__title\">\r

        \                <a href=\"#\">Intitulé de la tuile</a>\r

        \            </h3>\r

        \            <p class=\"fr-tile__desc\">Lorem [...] elit ut.</p>\r

        \        </div>\r

        \    </div>\r

        \    <div class=\"fr-tile__header\">\r

        \        <div class=\"fr-tile__pictogram\">\r

        \            <svg aria-hidden=\"true\" class=\"fr-artwork\" viewBox=\"0
        0 80 80\" width=\"80px\" height=\"80px\">\r

        \                <use class=\"fr-artwork-decorative\"
        href=\"../../../dist/artwork/pictograms/buildings/city-hall.svg#artwork\
        -decorative\"></use>\r

        \                <use class=\"fr-artwork-minor\"
        href=\"../../../dist/artwork/pictograms/buildings/city-hall.svg#artwork\
        -minor\"></use>\r

        \                <use class=\"fr-artwork-major\"
        href=\"../../../dist/artwork/pictograms/buildings/city-hall.svg#artwork\
        -major\"></use>\r

        \            </svg>\r

        \        </div>\r

        \    </div>\r

        </div>\r

        ```\r\n"
      isBreaking: false
      tickets:
        - DS-2725
      gitmojis:
        - 🎉
      tag: v1.10.0
      title: évolution des tuiles
      pull: https://github.com/GouvernementFR/dsfr/pull/534
    - id: "487"
      type: refactor
      scopes:
        - download
      description: "Pour mutualiser les comportements de la carte et du lien au
        composant download, celui-ci doit devenir une variante de ces composants
        et non pas l'inverse.\r

        \r

        Retrait du composant : téléchargement de fichier - Download ->
        déprécié\r

        Ajout de la variante de carte : fr-card--download \r

        Ajout de la variante de lien : fr-link--download \r

        \r

        Le lien de téléchargement : \r

        ```html\r

        <div class=\"fr-download\">\r

        \    <h3>\r

        \        <a href=\"[À MODIFIER - /example/img/image.jpg]\" download
        class=\"fr-download__link\">Télécharger le document lorem ipsum sit
        dolores amet\r

        \            <span class=\"fr-download__detail\">\r

        \                JPG – 61,88 ko\r

        \            </span>\r

        \        </a>\r

        \    </h3>\r

        </div>\r

        ```\r

        DEVIENT : \r

        ```html\r

        <a class=\"fr-link fr-link--download\" download href=\"[À MODIFIER -
        example/img/image.jpg]\">\r

        \    Télécharger le document lorem ipsum sit dolores amet <span
        class=\"fr-link__detail\">JPG – 61,88 ko</span>\r

        </a>\r

        ```\r

        \r

        et la carte de téléchargement : \r

        ```html\r

        <div class=\"fr-download fr-enlarge-link fr-download--card\">\r

        \    <h3>\r

        \        <a href=\"[À MODIFIER - example/img/image.jpg]\" download
        class=\"fr-download__link\">Télécharger le document lorem ipsum sit
        dolores amet\r

        \            <span class=\"fr-download__detail\">\r

        \                JPG – 61,88 ko\r

        \            </span>\r

        \        </a>\r

        \    </h3>\r

        \    <p class=\"fr-download__desc\">Texte de description<</p>\r

        </div>\r

        ```\r

        DEVIENT : \r

        ```html\r

        <div class=\"fr-card fr-enlarge-link fr-card--download\">\r

        \    <div class=\"fr-card__body\">\r

        \        <div class=\"fr-card__content\">\r

        \            <h3 class=\"fr-card__title\">\r

        \                <a download href=\"[À MODIFIER -
        example/img/image.jpg]\">\r

        \                    Télécharger le document lorem ipsum sit dolores
        amet\r

        \                </a>\r

        \            </h3>\r

        \            <p class=\"fr-card__desc\">Texte de description</p>\r

        \            <div class=\"fr-card__end\">\r

        \                <p class=\"fr-card__detail\">JPG – 61,88 ko</p>\r

        \            </div>\r

        \        </div>\r

        \    </div>\r

        </div>\r

        ```\r

        \r\n"

        - changelog
      description: "Outil en ligne de commande pour générer un journal des
        modifications `CHANGELOG.md` à partir des balises git et de l'historique
        des commits, nous utilisons
        [Auto-changelog](https://github.com/cookpete/auto-changelog).\r

        \r

        Commande à executer à la racine du projet, `git log` est exécuté en
        arrière-plan afin d'analyser l'historique des commits, en lançant :\r

        \r

        ```\r

        yarn version\r

        ```\r

        \r

        Il faut ensuite renseigner le numéro de version de la prochaine release
        :\r

        ```\r

        info Current version: x.x.x\r

        question New version: [X.X.X]\r

        ```\r

        \r

        La configuration est présente dans le fichier `.auto-changelog`.\r

        \r

        La gestion de l'affichage du changelog est présente dans le template
        [Handlebars](https://handlebarsjs.com/) `changelog-template.hbs`."
